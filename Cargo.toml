[package]
name = "yamaquasi"
version = "0.3.0"
rust-version = "1.80"
edition = "2021"
description = "An integer factoring utility"
license = "BSD3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[resolver]
incompatible-rust-versions = "fallback"

[dependencies]
arguments = "0.7"
bitvec_simd = "0.20"
bnum = { version = "0.8", features = ["numtraits"] }
num-integer = "0.1"
num-traits = "0.2"
rand = "0.8"
rayon = "1.12" # MSRV 1.80
wide = "0.7"

[dev-dependencies]
brunch = "=0.6.1" # MSRV 1.77

[profile.release]
debug = 2

[profile.bench]
debug = 2

[[bench]]
name = "arith"
harness = false

[[bench]]
name = "arith_montgomery"
harness = false

[[bench]]
name = "arith_poly"
harness = false

[[bench]]
name = "benchmatrix"
harness = false

[[bench]]
name = "ecm"
harness = false

[[bench]]
name = "matrix"
harness = false

[[bench]]
name = "matrixcls"
harness = false

[[bench]]
name = "matrixint"
harness = false

[[bench]]
name = "pm1"
harness = false

[[bench]]
name = "sieve"
harness = false

[[bench]]
name = "factor64"
harness = false

[[bench]]
name = "factorsmooth"
harness = false

[lints.clippy]
needless_range_loop = "allow"
len_zero = "allow"
some_filter = "allow"
assign_op_pattern = "allow"
result_large_err = "allow"
new_without_default = "allow"
