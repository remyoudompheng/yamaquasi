# Workflows related to pymqs

name: pymqs

on: [push, pull_request]

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is x86, macos-14 is arm64
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-15]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

    env:
      CIBW_BEFORE_ALL_LINUX: curl -sSf https://sh.rustup.rs | sh -s -- -y
      CIBW_BEFORE_ALL_WINDOWS: rustup target add i686-pc-windows-msvc
      CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
      # Current min version for Rust
      MACOSX_DEPLOYMENT_TARGET: 10.12

  sdist:
    name: Source tarball
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install build
      - run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  test:
    needs: build
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-24.04,
          ubuntu-24.04-arm,
          ubuntu-26.04,
          ubuntu-26.04-arm,
          windows-2022,
          windows-2025,
          macos-15,
          macos-15-intel,
          macos-26,
        ]
        python-version: ['3.11', '3.12', '3.13', '3.13t', '3.14', '3.14t', '3.15']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: false
      - uses: actions/download-artifact@v5
        with:
          path: wheelhouse
          merge-multiple: true

      # gmpy2 is missing binary wheels for Linux arm
      - run: sudo apt-get install libmpfr-dev libmpc-dev
        if: ${{ startsWith( matrix.os , 'ubuntu' ) }}

      - run: pip install gmpy2
      - run: pip install --no-index --find-links wheelhouse pymqs
      - run: python scripts/test_general.py -j1 1 120
